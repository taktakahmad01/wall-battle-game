<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Wall Battle</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html,
    body{
      width:100%;
      min-height:100%;
    }

    body{
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color:#fff;

      background:
        radial-gradient(
          circle at top,
          #24486d 0%,
          #101f32 52%,
          #07101b 100%
        );
    }

    .loader{
      width:100%;
      max-width:320px;

      padding:30px;

      text-align:center;
    }

    .logo{
      font-size:54px;
    }

    .title{
      margin-top:12px;

      font-size:25px;
      font-weight:900;
    }

    .title span{
      color:#66aaff;
    }

    .text{
      margin-top:10px;

      color:#8297ae;

      font-size:10px;
      font-weight:700;
    }

    .dots{
      margin-top:18px;

      display:flex;
      justify-content:center;

      gap:7px;
    }

    .dot{
      width:8px;
      height:8px;

      border-radius:50%;

      background:#65aaff;

      animation:
        pulse 1s ease-in-out infinite;
    }

    .dot:nth-child(2){
      animation-delay:.15s;
    }

    .dot:nth-child(3){
      animation-delay:.30s;
    }

    @keyframes pulse{

      0%,
      100%{
        opacity:.25;
        transform:scale(.75);
      }

      50%{
        opacity:1;
        transform:scale(1.15);
      }

    }
  </style>
</head>

<body>

  <main class="loader">

    <div class="logo">
      🧱
    </div>

    <div class="title">
      WALL
      <span>BATTLE</span>
    </div>

    <div class="text">
      Loading your game...
    </div>

    <div class="dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

  </main>


  <script
    type="module"
    src="js/router.js?v=1"
  ></script>

</body>

</html>
