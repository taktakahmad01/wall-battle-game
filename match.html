<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Finding Match</title>

  <link
    rel="stylesheet"
    href="css/match.css?v=3"
  >
</head>

<body>

  <main id="matchApp">

    <button
      id="cancelMatchBtn"
      class="cancel-btn"
      type="button"
    >
      ✕ CANCEL
    </button>


    <section class="match-card">

      <div class="match-title">
        FINDING OPPONENT
      </div>


      <div
        class="scanner"
        id="scanner"
      >

        <div class="radar-ring ring-1"></div>
        <div class="radar-ring ring-2"></div>
        <div class="radar-ring ring-3"></div>

        <div class="scan-light"></div>


        <div
          class="search-avatar"
          id="searchAvatar"
        >
          😎
        </div>


        <div
          class="found-badge"
          id="foundBadge"
        >
          ⚔️
        </div>

      </div>


      <div
        class="search-text"
        id="searchText"
      >
        SEARCHING
        <span id="searchDots">.</span>
      </div>


      <div
        class="match-subtext"
        id="matchSubtext"
      >
        Looking for a player
      </div>

    </section>

  </main>


  <script src="js/match.js?v=8"></script>

</body>

</html>
